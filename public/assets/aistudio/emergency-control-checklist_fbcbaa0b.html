<html lang="hi">
<head>
<meta charset="utf-8">

<title>Emergency Control & Checklist System</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;font-size:16px;line-height:1.45}
header{background:#0b1f4d;color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0;font-size:18px}header small{opacity:.8}
main{max-width:1000px;margin:0 auto;padding:12px;display:grid;gap:12px}
@media(min-width:800px){main{grid-template-columns:1fr 1.2fr}.full{grid-column:1/-1}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
select,input{width:100%;min-height:46px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
button{min-height:46px;padding:10px 14px;border:0;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.red{background:var(--red);color:#fff}button.grn{background:var(--grn);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
#banner{border-radius:14px;padding:14px;font-weight:600;border:2px solid}
#banner.bad{background:var(--redbg);border-color:var(--red);animation:p 1.4s infinite}
#banner.ok{background:var(--grnbg);border-color:var(--grn)}
#banner.idle{background:var(--card);border-color:var(--bd);font-weight:500}
@keyframes p{50%{opacity:.75}}@media(prefers-reduced-motion:reduce){#banner.bad{animation:none}}
#banner ul{margin:6px 0 0;padding-left:20px;font-weight:400}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--bd);border-radius:10px;margin:8px 0;min-height:56px;cursor:pointer}
.item.done{background:var(--grnbg);border-color:var(--grn)}
.item input{width:26px;min-height:26px;flex:none}
.item small{display:block;color:var(--mut)}
.em{border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}
.em.sel{outline:2px solid var(--pri)}
.p-high{border-left-color:var(--red)}.p-med{border-left-color:var(--amb)}.p-low{border-left-color:var(--grn)}

.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--grn)}
a{color:var(--pri)}.btn{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:600}@media print{body *{visibility:hidden}#rep,#rep *{visibility:visible}#rep{position:absolute;left:0;top:0;width:100%}}.mut{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<header><h1>🚨 Emergency Control & Checklist System</h1><small>EMERGENCY CONTROL ROOM · Hathras</small></header>
<main>
<div id="banner" class="full idle"></div>
<section class="card full" id="dash"></section>

<section class="card">
<h2>＋ नई Emergency</h2>
<label>अधिकारी का नाम (हर कार्रवाई के साथ दर्ज होगा)</label>
<input id="officer" placeholder="जैसे: SI राजेश कुमार">
<label>घटना का प्रकार</label><select id="type"></select>
<label>प्राथमिकता (Priority)</label>
<select id="pri"><option value="high">🔴 High – अति गंभीर</option><option value="med" selected>🟠 Medium</option><option value="low">🟢 Low</option></select>
<label>Location</label><select id="loc"></select>
<input id="cloc" placeholder="Custom location लिखें" style="display:none;margin-top:8px">
<div class="row" style="margin-top:10px"><button class="sec" id="gps" type="button">📍 मेरी GPS Location</button></div>
<div id="gpsmsg" class="mut"></div>
<details style="margin-top:12px"><summary class="mut" style="cursor:pointer">⚙️ अधिकारी के नंबर (CO / ASP / SP)</summary><label>CO</label><input id="n_co" type="tel" placeholder="CO का नंबर"><label>ASP</label><input id="n_asp" type="tel" placeholder="ASP का नंबर"><label>SP</label><input id="n_sp" type="tel" placeholder="SP का नंबर"></details>
<button id="add" style="width:100%;margin-top:12px">＋ Create Emergency</button>
</section>

<section class="card">
<h2>Emergency List <span id="cnt" class="tag"></span></h2>
<input id="q" placeholder="🔍 Search (नंबर, location, प्रकार)">
<div class="row" style="margin-top:8px"><select id="tf"></select><select id="flt"><option value="active">सक्रिय</option><option value="all">सभी</option><option value="Open">Open</option><option value="In Progress">In Progress</option><option value="Closed">Closed</option></select></div>
<div id="list"></div><button class="sec" id="bkb" style="width:100%;margin-top:10px">💾 Backup / Restore</button><div id="bkp" style="display:none;margin-top:8px"><div class="mut">Backup कॉपी करके WhatsApp/Notes में सुरक्षित रखें। Restore के लिए वही text नीचे paste करें।</div><textarea id="bkt" rows="5" style="width:100%;margin-top:6px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px;font-size:13px"></textarea><div class="row" style="margin-top:6px"><button id="bko">Backup बनाओ</button><button class="sec" id="bkc">CSV बनाओ</button><button class="sec" id="bkr">Restore</button></div><div id="bkm" class="mut"></div></div>
</section>

<section class="card full" id="detail"></section>
<div id="mapc" class="card" style="display:none;flex-direction:column;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));height:50vh;max-height:430px;z-index:30;padding:8px;box-shadow:0 4px 24px rgba(0,0,0,.35)"><div class="row" style="align-items:center;flex:none"><b id="mapt" style="flex:1;font-size:14px"></b><button class="sec" id="mapx" style="flex:none;min-height:36px;padding:4px 12px">✕ बंद</button></div><iframe id="mapf" title="Map" style="flex:1;width:100%;border:0;border-radius:10px;margin:6px 0" loading="lazy"></iframe><a id="mapl" target="_blank" rel="noopener" href="#" style="flex:none;font-size:14px">बड़े Map में खोलें</a></div>
</main>

 var ch=$("dash").querySelectorAll("[data-t]");for(var i=0;i<ch.length;i++)ch[i].onclick=function(){$("tf").value=this.getAttribute("data-t");render()}}
function callBtns(t){var a=[],N=S.nums||{};

 if(!a.length)return"";
 return'<span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+a.map(function(x){return x[1]?'<a class="btn" style="min-height:40px;padding:6px 12px" href="tel:'+x[1]+'">'+x[0]+'</a>':'<span class="tag" style="border-style:dashed">'+x[0]+'</span>'}).join("")+"</span>"}
function openMap(loc){var q=loc.replace("🚔 ",""),m=q.match(/^GPS:\s*(.+)$/);if(m)q=m[1];else{if(q.indexOf("थाना")===0)q=q.replace("थाना ","")+" Police Station";else if(q.indexOf("चौकी")===0)q=q.replace("चौकी ","")+" Police Chowki";if(q.toLowerCase().indexOf("hathras")<0)q+=", Hathras"}
 var u="https://www.google.com/maps?q="+encodeURIComponent(q);$("mapf").src=u+"&output=embed";$("mapl").href=u;$("mapt").textContent="📍 "+loc;$("mapc").style.display="flex"}
function nearBox(e){if(e.loc.indexOf("थाना")>-1||e.loc.indexOf("GRP")>-1)return"";var K="थाना Hathras (Kotwali)",M={"Mendu Gate, Hathras":K,"Chamar Gate, Hathras":K,"Agra Road, Hathras":K,"Sadabad Gate, Hathras":K,"🚔 चौकी Chamar Gate":K,"🚔 चौकी Agra Road":K,"🚔 चौकी Mendu Gate":K,"Hathras Junction":"थाना Hathras Junction","Mursan":"थाना Mursan","Sasni":"थाना Sasni","Sadabad":"थाना Sadabad","Sikandra Rao":"थाना Sikandra Rao","Hasayan":"थाना Hasayan","Sahpau":"थाना Sahpau","Chandpa":"थाना Chandpa"},k=M[e.loc];if(!k)return"";for(var i=0;i<CUG.length;i++)if(CUG[i][0]===k)return'<div style="margin:8px 0">📞 <b>संबंधित '+k+' CUG:</b> <a href="tel:'+CUG[i][1]+'">'+CUG[i][1]+'</a></div>';return""}
function notesBox(e){return'<h2 style="margin-top:14px">📝 Notes</h2>'+(e.notes||[]).map(function(n){return'<div class="item" style="cursor:default;min-height:0;display:block">'+esc(n.t)+'<small>'+tm(n.at)+' · '+esc(n.by)+'</small></div>'}).join('')+'<div class="row" style="margin-top:8px"><input id="nt" placeholder="जैसे: घायल 3, वाहन नंबर, निर्देश"><button id="nadd" style="flex:none">＋ जोड़ें</button></div>'}
function cugBox(e){
 var h='<div style="margin:8px 0">⏱ बीता समय: <b>'+el(e)+'</b>'+(late(e)?' <span style="color:var(--red)">⚠ SLA पार ('+SLA[e.pri]+' मि)</span>':'')+'</div>';
 for(var i=0;i<CUG.length;i++){if(e.loc.indexOf(CUG[i][0])>-1){h+='<div style="margin:8px 0">📞 <b>'+CUG[i][0]+' CUG:</b> <a href="tel:'+CUG[i][1]+'">'+CUG[i][1]+'</a></div>';break}}
 return h+nearBox(e)+'<div class="mut" style="margin:8px 0">त्वरित कॉल: <a href="tel:100">100 पुलिस</a> · <a href="tel:101">101 दमकल</a> · <a href="tel:108">108 एम्बुलेंस</a> · <a href="tel:112">112</a></div>'
}
var S={list:[],sel:null,officer:""};
try{var raw=localStorage.getItem("ecc_v2");if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem("ecc_v2",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function tm(t){return new Date(t).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function done(e){return e.items.filter(function(i){return i.at}).length}
function status(e){if(e.closed)return"Closed";return done(e)?"In Progress":"Open"}
var PR={high:"🔴 High",med:"🟠 Medium",low:"🟢 Low"},PO={high:0,med:1,low:2};
$("type").innerHTML=Object.keys(TYPES).map(function(k){return'<option value="'+k+'">'+TYPES[k]+"</option>"}).join("");
$("loc").innerHTML='<option value="">-- Location चुनें --</option>'+LOCS.map(function(l){return"<option>"+l+"</option>"}).join("")+'<option value="__c">अन्य / Custom Location</option>';
$("officer").value=S.officer||"";
$("officer").oninput=function(){S.officer=this.value;save()};
$("loc").onchange=function(){$("cloc").style.display=this.value==="__c"?"block":"none"};
$("gps").onclick=function(){
 var m=$("gpsmsg");
 if(!navigator.geolocation){m.textContent="GPS उपलब्ध नहीं है।";return}
 m.textContent="खोज रहे हैं...";
 try{navigator.geolocation.getCurrentPosition(function(p){
  var c=p.coords.latitude.toFixed(5)+", "+p.coords.longitude.toFixed(5);
  $("loc").value="__c";$("cloc").style.display="block";$("cloc").value="GPS: "+c;m.textContent="Location मिल गई।"
 },function(){m.textContent="GPS अनुमति नहीं मिली, Location हाथ से चुनें।"},{timeout:10000})}catch(e){m.textContent="GPS उपलब्ध नहीं है।"}
};
$("add").onclick=function(){
 var l=$("loc").value;if(l==="__c")l=$("cloc").value.trim();
 if(!l){alert("कृपया Location चुनें/लिखें।");return}
 var t=$("type").value,n=S.list.length+1;
 var e={id:Date.now(),no:"EM-"+("000"+n).slice(-3),type:t,loc:l,pri:$("pri").value,created:Date.now(),closed:null,by:S.officer||"-",
  items:CL2[t].map(function(x){return{t:x[0],c:x[1],at:null,by:null}})};
 S.list.unshift(e);S.sel=e.id;save();$("cloc").value="";render()
};
$("q").oninput=render;$("flt").onchange=render;
function vis(){
 var q=$("q").value.toLowerCase(),f=$("flt").value;
 return S.list.filter(function(e){
  var st=status(e);
  if(f==="active"&&st==="Closed")return false;if($("tf").value&&e.type!==$("tf").value)return false;
  if(f!=="active"&&f!=="all"&&st!==f)return false;
  return(e.no+e.loc+TYPES[e.type]).toLowerCase().indexOf(q)>-1
 }).sort(function(a,b){return(a.closed?1:0)-(b.closed?1:0)||PO[a.pri]-PO[b.pri]||b.created-a.created})
}
function get(){return S.list.filter(function(e){return e.id===S.sel})[0]}
function render(){
 var act=S.list.filter(function(e){return!e.closed}),v=vis(),e=get(),b=$("banner");
 $("cnt").textContent=v.length;dash();
 if(e&&!e.closed){
  var pend=e.items.filter(function(i){return!i.at});
  if(pend.length){b.className="full bad";b.innerHTML="🔴 EMERGENCY ALERT — CHECKLIST INCOMPLETE<br>Emergency: "+TYPES[e.type]+" ("+e.no+")<br>Location: "+esc(e.loc)+"<br>⏱ बीता समय: "+el(e)+(late(e)?" — ⚠ SLA पार":"")+"<br>Pending Actions:<ul>"+pend.map(function(i){return"<li>"+esc(i.t)+"</li>"}).join("")+"</ul>"}
  else{b.className="full ok";b.innerHTML="🟢 CHECKLIST COMPLETE — सभी कार्रवाई पूर्ण<br><span style='font-weight:400'>"+e.no+" · "+esc(e.loc)+" — अब Emergency बंद की जा सकती है।</span>"}
 }else{b.className="full idle";b.innerHTML=act.length?"सक्रिय Emergency: <b>"+act.length+"</b> — विवरण देखने के लिए सूची से चुनें।":"कोई सक्रिय Emergency नहीं।"}
 $("list").innerHTML=v.length?v.map(function(x){
  var d=done(x),n=x.items.length;
  return'<div class="em p-'+x.pri+(x.id===S.sel?" sel":"")+'" data-id="'+x.id+'"><b>'+x.no+"</b> "+TYPES[x.type]+'<br><span class="mut">📍 '+esc(x.loc)+'</span><br><span class="tag">'+PR[x.pri]+'</span><span class="tag">'+status(x)+'</span><span class="tag">'+d+"/"+n+'</span>'+tmr(x)+'<div class="bar"><i style="width:'+(d/n*100)+'%"></i></div></div>'
 }).join(""):'<p class="mut">कोई Emergency नहीं मिली।</p>';
 var els=$("list").querySelectorAll(".em");
 for(var i=0;i<els.length;i++)els[i].onclick=function(){S.sel=+this.getAttribute("data-id");save();render();$("detail").scrollIntoView({behavior:"smooth"})};
 var D=$("detail");
 if(!e){D.innerHTML='<p class="mut">कोई Emergency select करें।</p>';return}
 var d2=done(e),all=d2===e.items.length;
 D.innerHTML="<h2>"+e.no+" · "+TYPES[e.type]+'</h2><p class="mut">📍 '+esc(e.loc)+' · <a href="#" id="mapb">🗺 Map देखें</a><br>बनाई गई: '+tm(e.created)+" · "+esc(e.by)+(e.closed?"<br>बंद की गई: "+tm(e.closed):"")+'</p>'+cugBox(e)+'<span class="tag">'+PR[e.pri]+'</span><span class="tag">'+status(e)+"</span>"+
 e.items.map(function(it,i){return itemCard(it,i,e)}).join("")+
 notesBox(e)+'<div class="row" style="margin-top:12px"><button class="sec" id="repb">📄 रिपोर्ट</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(msg(e))+'">💬 WhatsApp</a><a class="btn" href="sms:?&body='+encodeURIComponent(msg(e))+'">✉ SMS</a></div>'+(REP?repBox(e):'')+'<div class="row" style="margin-top:12px">'+(e.closed?'<button class="sec" id="reopen">↺ फिर से खोलें</button>':'<button class="grn" id="close"'+(all?"":" disabled style='opacity:.5'")+'>✔ Emergency बंद करें</button>')+'<button class="sec" id="del">🗑 हटाएँ</button></div>';
 var cb=D.querySelectorAll("button[data-i]");
 for(var j=0;j<cb.length;j++)cb[j].onclick=function(){
  var it=e.items[+this.getAttribute("data-i")];
  if(!it.at){it.at=Date.now();it.by=S.officer||"-"}else{it.at=null;it.by=null}
  save();render()};
 if($("close"))$("close").onclick=function(){if(all){e.closed=Date.now();save();render()}};
 if($("reopen"))$("reopen").onclick=function(){e.closed=null;save();render()};
 var cs=D.querySelectorAll("select[data-cs]");for(var ci=0;ci<cs.length;ci++)cs[ci].onchange=function(){var it3=e.items[+this.getAttribute("data-cs")];if(this.value)it3.cn=this.value;else delete it3.cn;save();render()};
 var ts=D.querySelectorAll("select[data-ts]");for(var ti=0;ti<ts.length;ti++)ts[ti].onchange=function(){var it2=e.items[+this.getAttribute("data-ts")];if(this.value)it2.tn=this.value;else delete it2.tn;e.items.forEach(function(x){if(x.c==="co")delete x.cn});save();render()};
 $("mapb").onclick=function(ev){ev.preventDefault();openMap(e.loc)};
 $("nadd").onclick=function(){var v=$("nt").value.trim();if(!v)return;(e.notes=e.notes||[]).push({t:v,at:Date.now(),by:S.officer||"-"});save();render()};
 $("repb").onclick=function(){REP=!REP;render()};
 if($("cp"))$("cp").onclick=function(){var t=report(e);function sel(){var r=document.createRange();r.selectNodeContents($("rep"));var s=getSelection();s.removeAllRanges();s.addRange(r);$("cp").textContent="चुना गया – कॉपी करें"}try{navigator.clipboard.writeText(t).then(function(){$("cp").textContent="✔ कॉपी हुआ"},sel)}catch(x){sel()}};
 if($("pr"))$("pr").onclick=function(){try{window.print()}catch(x){}};
 $("del").onclick=function(){if(confirm("यह Emergency हटाएँ?")){S.list=S.list.filter(function(x){return x.id!==e.id});S.sel=null;save();render()}};
}
$("tf").innerHTML='<option value="">सभी घटनाएँ</option>'+Object.keys(TYPES).map(function(k){return'<option value="'+k+'">'+TYPES[k]+'</option>'}).join('');
S.nums=S.nums||{};var DEF={co:"9454401258",asp:"9454401064",sp:"9454400278"};for(var dk in DEF)if(!S.nums[dk])S.nums[dk]=DEF[dk];
["co","asp","sp"].forEach(function(k){var i=$("n_"+k);i.value=S.nums[k]||"";i.oninput=function(){S.nums[k]=this.value.replace(/[^0-9+]/g,"");save();render()}});
$("tf").onchange=render;

$("bkb").onclick=function(){var p=$("bkp");p.style.display=p.style.display==="none"?"block":"none"};

$("bkc").onclick=function(){var r=[["No","Type","Location","Priority","Status","Created","Closed","Done","Total","Notes"]];S.list.forEach(function(e){r.push([e.no,TYPES[e.type],e.loc,PR[e.pri],status(e),tm(e.created),e.closed?tm(e.closed):"",done(e),e.items.length,(e.notes||[]).map(function(n){return n.t}).join(" | ")])});$("bkt").value=r.map(function(x){return x.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");$("bkm").textContent="CSV तैयार — कॉपी करके Excel/Sheets में paste करें"};
$("bkr").onclick=function(){try{var d=JSON.parse($("bkt").value);if(!d.list)throw 0;if(confirm("मौजूदा data की जगह Backup restore करें?")){S=d;S.officer=S.officer||"";save();$("officer").value=S.officer;render();$("bkm").textContent="✔ Restore हो गया"}}catch(x){$("bkm").textContent="Backup text सही नहीं है।"}};
render();
setInterval(function(){var n=$("nt");if(n&&(n.value||document.activeElement===n))return;render()},60000);
